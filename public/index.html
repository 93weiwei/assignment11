<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>DevSecOps Demo</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        .hidden { display: none; }
        .btn-danger { background: red; color: white; border: none; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div style="background:#333; color:white; padding:15px; margin-bottom:20px;">
        <h3>🔧 Admin Console</h3>
        <label><input type="checkbox" id="toggle-short" onchange="updateBackendFlags()"> Feature: Short Login</label><br>
        <label><input type="checkbox" id="toggle-report" onchange="updateBackendFlags()"> Feature: Quick Report</label>
    </div>

    <div class="card">
        <h2>1. Login System</h2>
        <div id="login-container">Loading...</div>
    </div>

    <div class="card">
        <h2>2. News Feed</h2>
        <div id="feed-container">Loading...</div>
    </div>

    <script src="toggle.js"></script>
</body>
</html>
