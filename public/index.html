<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Legacy System</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        .hidden { display: none; }
        .btn { padding: 8px 16px; background: #ccc; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>👴 Legacy System (v1.0)</h1>
    <div class="card">
        <h2>1. Login (Old Step-by-Step)</h2>
        <div id="step1">
            <input type="text" placeholder="Email">
            <button class="btn" onclick="document.getElementById('step1').classList.add('hidden');document.getElementById('step2').classList.remove('hidden')">Next</button>
        </div>
        <div id="step2" class="hidden">
            <input type="password" placeholder="Password">
            <button class="btn" onclick="alert('Login logic...')">Login</button>
        </div>
    </div>
    <div class="card">
        <h2>2. News Feed (No Actions)</h2>
        <p>Post 1: Hello World <small>...More</small></p>
        <p>Post 2: Spam Content <small>...More</small></p>
    </div>
</body>
</html>
